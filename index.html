<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill7 | Seleção de Versão</title>
    <link rel="shortcut icon" href="https://skill7.onrender.com/assets/logo.svg" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
        }
        .card-bg {
            background-color: #1a1a1a;
            border: 1px solid #2d2d2d;
            transition: all 0.3s ease;
        }
        .card-bg:hover {
            border-color: #2563eb;
            transform: translateY(-2px);
        }
        .btn-primary {
            background-color: #2563eb;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .accent-border {
            border-top: 4px solid #2563eb;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="mb-12">
        <img src="https://skill7.onrender.com/assets/logotipo.svg" alt="">
    </div>

    <div class="max-w-4xl w-full text-center">
        <h2 class="text-2xl font-bold mb-4">Uma nova interface está pronta!</h2> <br><br>

        <div class="grid md:grid-cols-2 gap-6">
            
            <div class="card-bg p-8 rounded-xl flex flex-col items-center">
                <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h3 class="text-xl font-semibold mb-2">Versão Anterior</h3>
                <p class="text-sm text-gray-500 mb-6 italic">Acesso legado (V6)</p>
                <a href="https://pratica-mente.netlify.app/pratica-mente.html" class="w-full py-3 rounded-lg border border-gray-600 font-medium hover:bg-white hover:text-black transition-colors">
                    Acessar Versão Antiga
                </a>
            </div>

            <div class="card-bg p-8 rounded-xl flex flex-col items-center accent-border relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-blue-600 text-[10px] font-bold px-3 py-1 rounded-bl-lg">RECOMENDADO</div>
                <div class="w-12 h-12 bg-blue-900/50 rounded-full flex items-center justify-center mb-4 text-blue-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <h3 class="text-xl font-semibold mb-2">Nova Versão 2026</h3>
                <p class="text-sm text-blue-400 mb-6">Acesso principal (V7)</p>
                <a href="https://skill7.onrender.com/" class="w-full py-3 rounded-lg btn-primary font-bold shadow-lg shadow-blue-900/20 transition-all">
                    Acessar Nova Versão
                </a>
            </div>

        </div>
    </div>

</body>
</html>
